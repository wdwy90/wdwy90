name: Android Auto screenshots (review only)

# Renders the car screens in Google's templates host on the Android Automotive emulator and pushes
# the PNGs to the aa-shots-out branch. Runs only on the aa-shots branch; the shipped app is unchanged.
on:
  push:
    branches: ["aa-shots"]

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      OUT: ${{ github.workspace }}/shots
      ANDROID_AVD_HOME: /home/runner/.android/avd
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          mkdir -p "$OUT"
      - name: Use the shipped 1.9 (25) app source instead (before render only)
        if: hashFiles('.github/aa-shots/mode-before') != ''
        run: |
          git fetch -q --depth=1 origin 213b5a58f81001e466eed4068edcda576cbb2d67
          rm -rf pullup-menu/android
          git checkout FETCH_HEAD -- pullup-menu/android
          cp .github/aa-shots/DebugDriverBefore.kt .github/aa-shots/DebugDriver.kt
          cp .github/aa-shots/probe-before.sh .github/aa-shots/probe.sh
          echo "OUTBRANCH=aa-shots-out-before" >> "$GITHUB_ENV"
          grep -n "versionName" pullup-menu/android/app/build.gradle.kts
      - name: Build the debug APK with the automotive activity (this run only)
        working-directory: pullup-menu/android
        run: |
          set -o pipefail
          cat >> app/build.gradle.kts <<'KTS'

          dependencies { debugImplementation("androidx.car.app:app-automotive:1.7.0") }
          KTS
          mkdir -p app/src/debug/java/com/wdwy90/pullupmenu/car
          cp ../../.github/aa-shots/AndroidManifest.xml app/src/debug/AndroidManifest.xml
          cp ../../.github/aa-shots/DebugDriver.kt app/src/debug/java/com/wdwy90/pullupmenu/car/
          # Lets the screenshot run set states and tap rows (this run's debug build only).
          sed -i 's/^    override fun onCreateScreen(intent: Intent): Screen {$/&\n        DebugDriver.attach(this)/' app/src/main/java/com/wdwy90/pullupmenu/car/MenuSession.kt
          grep -n "DebugDriver.attach" app/src/main/java/com/wdwy90/pullupmenu/car/MenuSession.kt
          ./gradlew --no-daemon assembleDebug 2>&1 | tee "$OUT/build.log" | tail -5
          cp app/build/outputs/apk/debug/app-debug.apk "$OUT/../app-debug.apk"
      - name: Install an automotive system image
        run: |
          SDKM=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          AVDM=$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager
          $SDKM --list 2>/dev/null | grep -i automotive | sort -u > "$OUT/images.txt" || true
          cat "$OUT/images.txt"
          IMG=""
          for want in "android-34-ext9;android-automotive;x86_64" "android-33;android-automotive;x86_64" "android-35-ext15;android-automotive;x86_64" "android-34-ext9;android-automotive-playstore;x86_64"; do
            if grep -q "system-images;$want" "$OUT/images.txt"; then IMG="system-images;$want"; break; fi
          done
          [ -n "$IMG" ] || IMG=$(grep -o "system-images;[^ |]*automotive[^ |]*x86_64" "$OUT/images.txt" | tail -1)
          echo "IMG=$IMG" | tee -a "$GITHUB_ENV" "$OUT/chosen.txt"
          yes | $SDKM --licenses > /dev/null 2>&1 || true
          $SDKM --install "emulator" "platform-tools" "$IMG" > "$OUT/sdk-install.txt" 2>&1 || true
          tail -5 "$OUT/sdk-install.txt"
          $AVDM list device -c > "$OUT/devices.txt" 2>&1 || true
          DEV=$(grep -i automotive "$OUT/devices.txt" | grep -i 1024 | head -1)
          [ -n "$DEV" ] || DEV=$(grep -i automotive "$OUT/devices.txt" | head -1)
          echo "DEV=$DEV" | tee -a "$OUT/chosen.txt"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | $AVDM create avd -n aa -k "$IMG" ${DEV:+-d "$DEV"} --force > "$OUT/avd.txt" 2>&1 || echo "avdmanager exit $?" >> "$OUT/avd.txt"
          if [ ! -f "$ANDROID_AVD_HOME/aa.ini" ]; then
            echo "retry without a device profile" >> "$OUT/avd.txt"
            echo no | $AVDM create avd -n aa -k "$IMG" --force >> "$OUT/avd.txt" 2>&1 || echo "avdmanager exit $?" >> "$OUT/avd.txt"
          fi
          ls -la "$ANDROID_AVD_HOME" >> "$OUT/avd.txt" 2>&1
          $ANDROID_HOME/emulator/emulator -list-avds >> "$OUT/avd.txt" 2>&1 || true
          tr '\r' '\n' < "$OUT/avd.txt" | grep -v "^\s*$" | tail -20
      - name: Boot
        run: |
          export PATH=$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH
          nohup emulator -avd aa -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -camera-back none -camera-front none > "$OUT/emulator.txt" 2>&1 &
          timeout 300 adb wait-for-device || { echo "no device"; tail -50 "$OUT/emulator.txt"; exit 1; }
          for i in $(seq 1 120); do
            [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && break
            sleep 5
          done
          echo "boot after ~$((i*5)) s" | tee "$OUT/boot.txt"
          sleep 30
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
      - name: Probe
        env:
          APK: ${{ github.workspace }}/app-debug.apk
        run: |
          export PATH=$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH
          bash .github/aa-shots/probe.sh
      - name: Publish to aa-shots-out
        if: always()
        run: |
          cd "$OUT"
          rm -f logcat-all.txt.gz; [ -f logcat-all.txt ] && gzip -f logcat-all.txt
          git init -q
          git checkout -q -b "${OUTBRANCH:-aa-shots-out}"
          git add .
          git -c user.name="aa-shots" -c user.email="aa-shots@users.noreply.github.com" commit -qm "Android Auto screenshots for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" "${OUTBRANCH:-aa-shots-out}"
