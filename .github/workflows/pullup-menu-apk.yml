name: Build Pull Up Menu APK

on:
  push:
    paths: ["pullup-menu/android/**", "pullup-menu/shared/**", ".github/workflows/pullup-menu-apk.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pullup-menu/android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Build and test
        run: |
          set -o pipefail
          ./gradlew --no-daemon --continue assembleDebug testDebugUnitTest lintDebug 2>&1 | tee build.log
      # Run logs aren't always downloadable, so failures are also posted as annotations.
      - name: Report failures
        if: failure()
        run: |
          annotate() { # title, then lines on stdin
            msg=$(head -c 30000 | sed 's/%/%25/g; s/\r//g' | awk '{printf "%s%%0A", $0}')
            [ -n "$msg" ] && echo "::error title=$1::$msg"
            true
          }
          grep -E "^e: |^w: .*(error|Unresolved)|error:|ERROR:|AAPT|What went wrong|FAILED|Execution failed" build.log | head -80 | annotate "Compile and task errors" || true
          if [ -f app/build/reports/lint-results-debug.xml ]; then
            python3 -c '
          import sys, xml.etree.ElementTree as ET
          for i in ET.parse(sys.argv[1]).getroot().iter("issue"):
              if i.get("severity") in ("Error", "Fatal"):
                  loc = i.find("location")
                  where = (loc.get("file", "").split("/app/")[-1] + ":" + loc.get("line", "?")) if loc is not None else ""
                  print(i.get("id"), where, i.get("message"))
          ' app/build/reports/lint-results-debug.xml | head -40 | annotate "Lint errors" || true
          fi
          for f in app/build/test-results/testDebugUnitTest/*.xml; do
            [ -f "$f" ] && grep -A4 "<failure" "$f" | head -20
          done | annotate "Unit test failures" || true
      - name: Summarize lint warnings
        if: always()
        run: |
          [ -f app/build/reports/lint-results-debug.xml ] || exit 0
          msg=$(python3 -c '
          import sys, collections, xml.etree.ElementTree as ET
          seen = collections.OrderedDict()
          for i in ET.parse(sys.argv[1]).getroot().iter("issue"):
              loc = i.find("location")
              where = (loc.get("file", "").split("/app/")[-1] + ":" + loc.get("line", "?")) if loc is not None else ""
              seen.setdefault((i.get("severity"), i.get("id")), []).append(where + " " + (i.get("message") or "")[:140])
          for (sev, iid), items in seen.items():
              print(f"{sev} {iid} x{len(items)}: " + " | ".join(items[:3]))
          ' app/build/reports/lint-results-debug.xml | head -c 20000 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          [ -n "$msg" ] && echo "::notice title=Lint summary::$msg" || true
      - name: Summarize unit tests
        if: always()
        run: |
          ls app/build/test-results/testDebugUnitTest/*.xml >/dev/null 2>&1 || exit 0
          msg=$(python3 -c '
          import glob, collections, xml.etree.ElementTree as ET
          ran, failed, skipped = collections.Counter(), 0, 0
          for p in glob.glob("app/build/test-results/testDebugUnitTest/*.xml"):
              s = ET.parse(p).getroot()
              name = s.get("name", "?").split(".")  # package, e.g. core in com.wdwy90.pullupmenu.core.FooTest
              ran[name[-2] if len(name) > 1 else name[0]] += int(s.get("tests", 0))
              failed += int(s.get("failures", 0)) + int(s.get("errors", 0))
              skipped += int(s.get("skipped", 0))
          parts = ", ".join("%s %d" % kv for kv in sorted(ran.items()))
          print("%d tests (%s), %d failed, %d skipped" % (sum(ran.values()), parts, failed, skipped))
          ')
          echo "::notice title=Unit tests::$msg"
      - uses: actions/upload-artifact@v5
        with:
          name: pullup-menu-apk
          path: pullup-menu/android/app/build/outputs/apk/debug/app-debug.apk
