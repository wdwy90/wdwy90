name: Build Pull Up Menu APK

on:
  push:
    paths: ["pullup-menu/**", ".github/workflows/pullup-menu-apk.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pullup-menu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Build and test
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: pullup-menu-apk
          path: pullup-menu/app/build/outputs/apk/debug/app-debug.apk
