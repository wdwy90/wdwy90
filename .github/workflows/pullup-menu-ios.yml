name: Build Pull Up Menu (iOS)

on:
  push:
    paths: ["pullup-menu/ios/**", "pullup-menu/shared/**", ".github/workflows/pullup-menu-ios.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: pullup-menu/ios
    steps:
      - uses: actions/checkout@v5
      - name: Core logic tests
        run: swift test --package-path PullUpCore
      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen generate
      - name: Build app + Live Activity widget (simulator, unsigned)
        run: |
          xcodebuild -project PullUpMenu.xcodeproj -scheme PullUpMenu \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -50
          test ${PIPESTATUS[0]} -eq 0
